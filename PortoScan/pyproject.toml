[project]
name = "portoscan"
version = "0.1.0"
description = "Authorized-use TCP port scanner with a Textual UI"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2,<9",
    "textual-fspicker>=1,<2",
    "platformdirs>=4,<5",
    "rich>=14.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-textual-snapshot", "ruff"]

[project.scripts]
portoscan = "portoscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portoscan"]
artifacts = ["src/portoscan/styles/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
